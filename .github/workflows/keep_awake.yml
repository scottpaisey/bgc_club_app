name: 🔄 Keep Streamlit App Awake

# 🎯 FIX: Force GitHub Actions to use Node 24 to suppress the deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Cron Schedule: Triggers automatically every 10 hours
    - cron: '0 0,10 * * *'
  workflow_dispatch: # Allows manual trigger clicks from your GitHub panel

jobs:
  ping-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4

    - name: 🕒 Update Keep Alive Timestamp
      run: |
        echo "Last Background Check: $(date)" > keep_alive.txt

    - name: 🚀 Commit and Push Keep-Alive Update
      run: |
        git config --global user.name "BGC Club Bot"
        git config --global user.email "bot@bgc-club.internal"
        git add keep_alive.txt
        git commit -m "chore: keep-awake heartbeat ping [skip ci]" || exit 0
        git push
