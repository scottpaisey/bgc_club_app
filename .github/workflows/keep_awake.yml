name: 🔄 Keep Streamlit App Awake

on:
  schedule:
    # 🎯 Cron Schedule: Triggers automatically every 10 hours (00:00 and 10:00 UTC daily)
    - cron: '0 0,10 * * *'
  workflow_dispatch: # Allows you to manually click "Run" from GitHub Actions if needed

jobs:
  ping-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the runner permission to update your keep_alive text file

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4

    - name: 🕒 Update Keep Alive Timestamp
      run: |
        echo "Last Background Check: $(date)" > keep_alive.txt

    - name: 🚀 Commit and Push Keep-Alive Update
      run: |
        git config --global user.name "BGC Club Bot"
        git config --global user.email "bot@bgc-club.internal"
        git add keep_alive.txt
        # Using [skip ci] prevents the commit from triggering unnecessary redeployment compile loops
        git commit -m "chore: keep-awake heartbeat ping [skip ci]" || exit 0
        git push
